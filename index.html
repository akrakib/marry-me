<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1a0010;
      font-family: 'Lato', sans-serif;
      color: white;
    }

    /* AURORA */
    .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .aurora span {
      position: absolute; border-radius: 50%;
      filter: blur(80px); opacity: .5;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .aurora span:nth-child(1) {
      width:600px; height:600px;
      background: radial-gradient(circle,#ff2d6b,transparent);
      top:-200px; left:-150px; animation-duration:14s;
    }
    .aurora span:nth-child(2) {
      width:500px; height:500px;
      background: radial-gradient(circle,#c0005a,transparent);
      bottom:-180px; right:-120px; animation-duration:10s; animation-delay:-3s;
    }
    .aurora span:nth-child(3) {
      width:400px; height:400px;
      background: radial-gradient(circle,#ff7eb3,transparent);
      top:40%; left:30%; animation-duration:16s; animation-delay:-6s; opacity:.3;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.12); }
    }

    /* STARS */
    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle 3s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity:.1; transform:scale(1); }
      to   { opacity:.9; transform:scale(1.5); }
    }

    /* CARD */
    .card {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255,100,150,0.25);
      border-radius: 32px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 440px; width: 90%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardIn .9s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(60px) scale(.94); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .pulse-ring {
      position: absolute; inset:-4px; border-radius: 36px;
      border: 2px solid rgba(255,45,107,0.4);
      animation: pulseRing 2.5s ease-out infinite;
    }
    @keyframes pulseRing {
      0%   { opacity:.6; transform:scale(1); }
      100% { opacity:0;  transform:scale(1.04); }
    }

    /* RING */
    .ring-wrap {
      font-size: 3.5rem; margin-bottom: .8rem; display: inline-block;
      animation: ringFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255,215,0,.7));
    }
    @keyframes ringFloat {
      0%,100% { transform:translateY(0) rotate(-5deg); }
      50%     { transform:translateY(-14px) rotate(5deg); }
    }

    /* HEADING */
    .card h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem,5vw,1.85rem);
      font-weight: 700; line-height: 1.35;
      background: linear-gradient(135deg,#fff 0%,#ffb3cc 60%,#ffd700 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.8rem;
      animation: fadeUp .7s .3s both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* YES BUTTON — card এর ভেতরে */
    .btn-yes {
      padding: 14px 36px;
      font-size: 1rem; font-weight: 700;
      font-family: 'Lato', sans-serif;
      border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg,#ff2d6b,#c0005a);
      color: white;
      box-shadow: 0 6px 28px rgba(255,45,107,.55);
      transition: transform .2s, box-shadow .2s;
      letter-spacing: .5px;
      display: block; margin: 0 auto 1.5rem;
      animation: fadeUp .7s .5s both;
    }
    .btn-yes:hover, .btn-yes:active {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 10px 36px rgba(255,45,107,.75);
    }

    /* NO BUTTON — fixed, সবসময় দৃশ্যমান */
    #no {
      position: fixed;
      top: 80px;
      right: 30px;
      z-index: 9999;
      padding: 12px 28px;
      font-size: 1rem;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 50px;
      cursor: pointer;
      background: rgba(255,255,255,0.12);
      color: white;
      backdrop-filter: blur(12px);
      letter-spacing: .5px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: top .1s, left .1s, right .1s;
    }

    /* DIVIDER */
    .divider {
      width:60px; height:2px;
      background: linear-gradient(90deg,transparent,#ff7eb3,transparent);
      margin: 1rem auto; border-radius:2px;
    }

    /* DOLLS */
    #dolls {
      display:none; font-size:2.5rem; margin:.5rem 0;
      animation: jump .5s ease-in-out infinite alternate;
    }
    @keyframes jump {
      from { transform:translateY(0) scale(1); }
      to   { transform:translateY(-14px) scale(1.08); }
    }

    /* RESULT */
    #result {
      font-family:'Playfair Display',serif;
      font-style:italic; font-size:1.1rem;
      color:#ffb3cc; line-height:1.7; min-height:50px;
    }

    /* HEARTS */
    .heart {
      position:fixed; pointer-events:none;
      animation: floatUp linear forwards; z-index:5;
    }
    @keyframes floatUp {
      0%   { transform:translateY(0) scale(1) rotate(0deg); opacity:1; }
      100% { transform:translateY(-105vh) scale(1.3) rotate(20deg); opacity:0; }
    }

    /* BYLINE */
    .byline {
      position:fixed; bottom:1rem; width:100%; text-align:center;
      font-size:.75rem; color:rgba(255,255,255,0.25);
      letter-spacing:2px; text-transform:uppercase; z-index:10;
    }
  </style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<div class="stars" id="stars"></div>

<!-- CARD -->
<div class="card">
  <div class="pulse-ring"></div>
  <div class="ring-wrap">💍</div>
  <h1>Dear, Will You<br>Marry Me?</h1>
  <button class="btn-yes" onclick="sayYes()">Yes, Always 💖</button>
  <div class="divider"></div>
  <div id="dolls">🧸 💕 🧸</div>
  <div id="result"></div>
</div>

<!-- NO BUTTON — card এর বাইরে, fixed -->
<button id="no">No 😜</button>

<p class="byline">Design by &nbsp;<a href="https://rosterkabir.wordpress.com" target="_blank" style="color:rgba(255,180,200,0.8);text-decoration:none;border-bottom:1px solid rgba(255,180,200,0.4);padding-bottom:1px;transition:color .2s" onmouseover="this.style.color='#ffb3cc'" onmouseout="this.style.color='rgba(255,180,200,0.8)'">A Kabir</a> &nbsp;✦&nbsp; Made with Love</p>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 1;
    s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}vh;left:${Math.random()*100}vw;animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s;`;
    starsEl.appendChild(s);
  }

  // No button
  const noBtn = document.getElementById('no');

  function moveNo() {
    const bw = noBtn.offsetWidth  + 20;
    const bh = noBtn.offsetHeight + 20;
    const x  = Math.random() * (window.innerWidth  - bw);
    const y  = Math.random() * (window.innerHeight - bh);
    noBtn.style.top   = y + 'px';
    noBtn.style.left  = x + 'px';
    noBtn.style.right = 'auto';
  }

  noBtn.addEventListener('mouseover', moveNo);

  noBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();  // click fire হবে না
    e.stopPropagation(); // bubble বন্ধ
    moveNo();

    // touch শেষ হওয়ার পর আবার সরে যাবে
    noBtn.style.pointerEvents = 'none';
    setTimeout(() => {
      noBtn.style.pointerEvents = 'auto';
    }, 400);
  }, { passive: false });

  // যদি কোনোভাবে click fire হয় তবুও cancel
  noBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    moveNo();
  });

  // Yes
  function sayYes() {
    document.getElementById('result').innerHTML =
      'আমি জানতাম 😏💖<br><em>Babur Ammu, তুমি শুধু আমারই ❤️</em>';
    document.getElementById('dolls').style.display = 'block';
    for (let i = 0; i < 40; i++) setTimeout(createHeart, i * 60);
  }

  // Hearts
  const emojis = ['💖','💗','💓','💞','💝','❤️','🌹','✨'];
  function createHeart() {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const dur = Math.random() * 3 + 3;
    h.style.cssText = `left:${Math.random()*100}vw;bottom:-5vh;font-size:${Math.random()*22+16}px;animation-duration:${dur}s;`;
    document.body.appendChild(h);
    setTimeout(() => h.remove(), dur * 1000);
  }
  setInterval(createHeart, 500);
</script>
</body>
</html>
